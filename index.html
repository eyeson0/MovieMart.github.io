<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MovieMart</title>
    <meta name="description" content="Premium movie marketplace for digital streaming, cinema tickets, collector editions, and movie discovery." />
    <meta property="og:title" content="MovieMart" />
    <meta property="og:description" content="Premium movie marketplace for digital streaming, cinema tickets, collector editions, and movie discovery." />
    <meta name="theme-color" content="#0d0e15" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Cinzel:wght@600;700;900&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#0b0c10] text-[#e0e2ec] antialiased selection:bg-rose-600 selection:text-white min-h-screen">
    <div id="root"></div>
    <script>
      // In development environments with disabled HMR / cloud reverse proxy, ignore WebSocket errors
      window.addEventListener('unhandledrejection', (event) => {
        if (event.reason && (typeof event.reason === 'string' && event.reason.includes('WebSocket')) || (event.reason?.message && event.reason.message.includes('WebSocket'))) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', (event) => {
        if (event.message && event.message.includes('WebSocket')) {
          event.preventDefault();
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
